<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart</title>

<style>
body {
    font-family: Arial;
    background:#f5f7fa;
    color:#222;
    text-align:center;
}

table {
    margin:auto;
    border-collapse: collapse;
    width: 85%;
    background:white;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

th, td {
    border:1px solid #ddd;
    padding:10px;
}

th { background:#e3eaf2; }

/* 🔥 BUTTON ANIMATION */
button {
    background:#4da6ff;
    color:white;
    border:none;
    padding:6px 10px;
    cursor:pointer;
    border-radius:5px;
    transition: all 0.2s ease;
}

button:hover {
    transform: scale(1.05);
    background:#3399ff;
}

button:active {
    transform: scale(0.95);
    box-shadow: 0 0 10px #4da6ff;
}

/* 🔥 QUANTITY BUTTON STYLE */
.qty-btn {
    padding:4px 8px;
    margin:2px;
}

/* 🔥 CLEAR CART BUTTON */
.clear-btn {
    margin-top:20px;
    background:red;
}

</style>
</head>

<body>

<h1>Your Cart</h1>

<table id="cartTable">
<tr>
<th>Image</th>
<th>Product</th>
<th>Price</th>
<th>Qty</th> <!-- NEW -->
<th>Total</th> <!-- NEW -->
<th>Remove</th>
</tr>
</table>

<h3 id="subtotal"></h3>
<h3 id="gst"></h3>
<h3 id="delivery"></h3>
<h2 id="total"></h2>

<div>
<a href="index.html"><button>← Back to Shop</button></a>
<a href="checkout.html"><button>Proceed to Checkout</button></a>
</div>

<!-- 🔥 CLEAR CART BUTTON -->
<button class="clear-btn" onclick="clearCart(this)">Clear Cart</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

/* 🔥 UPDATED IMAGE MAP (MATCHES INDEX.HTML EXACTLY) */
const images = {
    "Polex Ultra Classic": "https://cdn.thewatchpages.com/app/uploads/2025/04/30204022/rolex-gmt-master-ii-126715chnr-0002.jpeg?width=672",

    "Bentley Royal Dial": "https://img.tatacliq.com/images/i26//658Wx734H/MP000000028085646_658Wx734H_202508301255101.jpeg",

    "Etho Companion Pro": "https://cdn1.ethoswatches.com/media/catalog/product/cache/6e5de5bc3d185d8179cdc7258143f41a/h/u/hublot-spirit-of-big-bang-642-nx-0170-rx-large.jpg",

    "Zealand Classic Mechanical": "https://cdn1.ethoswatches.com/media/catalog/product/cache/6e5de5bc3d185d8179cdc7258143f41a/j/a/jacob-co-epic-x-ex100-43-bb-aa-abrua-large.jpg",

    "Benling Bones Dials": "https://www.justwatches.com/cdn/shop/files/PWNAA0122.jpg?v=1734945997&width=3000",

    "Bobs Minute Hand": "https://cdn1.ethoswatches.com/media/catalog/product/cache/6e5de5bc3d185d8179cdc7258143f41a/l/o/louis-moinet-memoris-lm-79-20-31-large.jpg",

    "Mayanks Signature Dial": "https://cdn1.ethoswatches.com/media/catalog/product/cache/6e5de5bc3d185d8179cdc7258143f41a/h/u/hublot-big-bang-451-ex-5120-ex-large.jpg",

    "Casual Yellow Dial": "https://cdn1.ethoswatches.com/media/catalog/product/cache/6e5de5bc3d185d8179cdc7258143f41a/b/r/breitling-avenger-sb0147101i1x2-large.jpg",

    "Heavenly Pink Companion": "https://cdn1.ethoswatches.com/media/catalog/product/cache/6e5de5bc3d185d8179cdc7258143f41a/h/u/hublot-big-bang-441-ul-5820-nr-large.jpg",

    "Polex Oyster Perpetual": "https://cdn1.ethoswatches.com/media/catalog/product/cache/6e5de5bc3d185d8179cdc7258143f41a/h/u/hublot-big-bang-642-qk-0110-nr-large.jpg"
};

/* 🔥 ADD QUANTITY IF NOT PRESENT */
cart = cart.map(item => ({...item, qty: item.qty || 1}));

function loadCart(){

    let table = document.getElementById("cartTable");

    table.innerHTML = `
    <tr>
    <th>Image</th>
    <th>Product</th>
    <th>Price</th>
    <th>Qty</th>
    <th>Total</th>
    <th>Remove</th>
    </tr>`;

    let subtotal = 0;

    cart.forEach((item, index)=>{

        let itemTotal = item.price * item.qty;
        subtotal += itemTotal;

        table.innerHTML += `
        <tr>
        <td><img src="${images[item.name]}" width="60"></td>
        <td>${item.name}</td>
        <td>₹${item.price}</td>

        <!-- 🔥 QUANTITY CONTROLS -->
        <td>
        <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
        ${item.qty}
        <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
        </td>

        <td>₹${itemTotal}</td>

        <td><button onclick="removeItem(${index}, this)">X</button></td>
        </tr>`;
    });

    let gst = subtotal * 0.02;
    let delivery = subtotal * 0.05;
    let total = subtotal + gst + delivery;

    document.getElementById("subtotal").innerText = "Subtotal: ₹" + subtotal;
    document.getElementById("gst").innerText = "GST (2%): ₹" + gst.toFixed(2);
    document.getElementById("delivery").innerText = "Delivery (5%): ₹" + delivery.toFixed(2);
    document.getElementById("total").innerText = "Total: ₹" + total.toFixed(2);
}

/* 🔥 QUANTITY FUNCTION */
function changeQty(index, change){
    cart[index].qty += change;

    if(cart[index].qty <= 0){
        cart.splice(index,1);
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
}

/* 🔥 REMOVE WITH ANIMATION */
function removeItem(index, btn){
    btn.innerText = "Removed";
    btn.style.background = "red";

    setTimeout(()=>{
        cart.splice(index,1);
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
    },500);
}

/* 🔥 CLEAR CART FUNCTION */
function clearCart(btn){
    btn.innerText = "Cleared!";
    btn.style.background = "darkred";

    setTimeout(()=>{
        cart = [];
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
    },500);
}

loadCart();
</script>

</body>
</html>
